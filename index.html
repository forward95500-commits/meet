<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여기서 만나 - 실시간 약속장소 & 위치 메이트</title>
    <!-- Tailwind CSS & Leaflet -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Realtime SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        #map { height: 100vh; width: 100%; z-index: 1; }
        .my-custom-marker {
            width: 32px; height: 32px; background-color: #10B981; border: 3px solid #ffffff;
            border-radius: 50%; box-shadow: 0 0 14px rgba(16, 185, 129, 0.8); text-align: center;
            line-height: 26px; color: white; font-weight: bold; font-size: 13px;
            animation: pulse 1.8s infinite; z-index: 1000 !important;
        }
        .user-marker {
            width: 28px; height: 28px; background-color: #3B82F6; border: 3px solid #ffffff;
            border-radius: 50%; box-shadow: 0 0 10px rgba(59, 130, 246, 0.6); text-align: center;
            line-height: 22px; color: white; font-weight: bold; font-size: 11px;
        }
        .target-marker {
            width: 36px; height: 36px; background-color: #EF4444; border: 3px solid #ffffff;
            border-radius: 50%; box-shadow: 0 0 14px rgba(239, 68, 68, 0.8); text-align: center;
            line-height: 30px; color: white; font-size: 16px; animation: bounce 1s infinite alternate;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
    </style>
</head>
<body class="bg-gray-900 text-slate-100 h-screen w-screen overflow-hidden font-sans">

    <!-- 상단 대시보드 바 -->
    <header class="fixed top-0 left-0 right-0 z-30 bg-gray-900/90 backdrop-blur-md border-b border-gray-800 px-4 py-2.5 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-500 text-white w-9 h-9 rounded-xl flex items-center justify-center font-bold shadow">
                <i class="fa-solid fa-location-crosshairs"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-base font-extrabold text-white tracking-tight">여기서 만나</h1>
                    <span id="room-tag" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-mono px-2 py-0.5 rounded-full">방 생성 대기</span>
                </div>
                <p id="gps-status-text" class="text-[11px] text-amber-400 font-medium">📍 위치 수신 대기 중...</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="panToMyLocation()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-xl font-bold transition flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-crosshairs"></i> 내 위치 찾기
            </button>
            <button onclick="copyShareLink()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-xl font-bold transition flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-share-nodes"></i> 초대링크
            </button>
            <button onclick="openDutchPayModal()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-3 py-2 rounded-xl font-bold transition flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-calculator"></i> 회비 정산
            </button>
            <button onclick="explodeRoom()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-3 py-2 rounded-xl font-bold transition flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-bomb"></i> 방 폭파
            </button>
        </div>
    </header>

    <!-- 1단계: 모임방 개설 모달 -->
    <div id="create-modal" class="fixed inset-0 z-40 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-3xl max-w-md w-full shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-emerald-600 to-teal-700 p-6 text-white">
                <span class="bg-black/20 text-emerald-100 text-xs font-bold px-3 py-1 rounded-full">📍 초간단 모임방 생성</span>
                <h2 class="text-2xl font-black mt-2">여기서 만나</h2>
                <p class="text-xs text-emerald-100 mt-1">닉네임과 약속 장소를 정하면 실시간 위치 공유방이 생성됩니다.</p>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">내 닉네임</label>
                    <input type="text" id="init-username" placeholder="예: 길동이" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">모임 이름</label>
                    <input type="text" id="init-roomtitle" placeholder="예: 번개 모임 ⚡" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">약속 장소 (상호명/주소)</label>
                    <div class="flex gap-2">
                        <input type="text" id="init-target-input" placeholder="예: 운암명가, 동탄역, 강남역 스타벅스" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                        <button onclick="searchInitTarget()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-xl text-xs transition">검색</button>
                    </div>
                    <p id="search-result-text" class="text-[11px] text-emerald-400 mt-1 hidden"></p>
                </div>
                <button onclick="submitRoomCreation()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition text-sm flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-rocket"></i> 모임방 바로 개설하기
                </button>
            </div>
        </div>
    </div>

    <!-- 2단계: 메인 지도 영역 -->
    <main class="relative w-full h-full pt-14">
        <div id="map"></div>

        <!-- 하단 실시간 채팅창 -->
        <div class="absolute bottom-4 left-4 right-4 md:left-6 md:w-96 z-20 bg-gray-900/90 backdrop-blur-md border border-gray-800 rounded-2xl p-3 shadow-2xl flex flex-col gap-2">
            <div id="chat-box" class="h-24 overflow-y-auto text-xs text-gray-300 flex flex-col gap-1 pr-1 font-sans">
                <div class="text-emerald-400 font-semibold">👋 실시간 모임방에 오신 것을 환영합니다! 초대 링크를 공유해 보세요.</div>
            </div>
            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="메시지 입력..." class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-500" onkeypress="if(event.key==='Enter') sendChat()">
                <button onclick="sendChat()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold">전송</button>
            </div>
        </div>
    </main>

    <!-- 회비 정산 모달 -->
    <div id="dutch-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-5 max-w-sm w-full shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-white flex items-center gap-2"><i class="fa-solid fa-calculator text-amber-400"></i> 회비 1/N 정산기</h3>
                <button onclick="closeDutchModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">총 지출 금액 (원)</label>
                    <input type="number" id="total-amount" placeholder="예: 60000" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">정산 인원 (명)</label>
                    <input type="number" id="dutch-count" value="3" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <button onclick="calculateDutch()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded-xl text-xs transition">정산 금액 계산</button>
                <div id="dutch-result" class="hidden bg-gray-900 border border-amber-500/30 p-3 rounded-xl text-center">
                    <p class="text-xs text-gray-400">1인당 보내야 할 금액</p>
                    <p id="dutch-price" class="text-lg font-black text-amber-400 mt-0.5">0원</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://meet-here-default-rtdb.asia-southeast1.firebasedatabase.app" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let map, myMarker, targetMarker;
        let userMarkers = {};
        let myPos = null;
        let tempTargetPos = null;
        let currentRoomId = null;
        let myNickName = "나";

        const urlParams = new URLSearchParams(window.location.search);
        const roomIdParam = urlParams.get('room');

        window.onload = () => {
            if (roomIdParam) {
                currentRoomId = roomIdParam;
                document.getElementById('create-modal').classList.add('hidden');
                myNickName = prompt("모임방 닉네임을 입력해주세요:", "길동이") || "참여자";
                initApp();
            }
        };

        async function fetchLocation(query) {
            try {
                const kakaoRes = await fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(query)}`, {
                    headers: { Authorization: "KakaoAK 23a9d94185bc0aa8c33a4d334546682b" }
                });
                if (kakaoRes.ok) {
                    const kData = await kakaoRes.json();
                    if (kData.documents && kData.documents.length > 0) {
                        const item = kData.documents[0];
                        return { lat: parseFloat(item.y), lng: parseFloat(item.x), name: item.place_name };
                    }
                }
            } catch (e) {}

            try {
                const osmRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const oData = await osmRes.json();
                if (oData && oData.length > 0) {
                    return { lat: parseFloat(oData[0].lat), lng: parseFloat(oData[0].lon), name: oData[0].display_name.split(',')[0] };
                }
            } catch (e) {}

            return null;
        }

        async function searchInitTarget() {
            const query = document.getElementById('init-target-input').value.trim();
            if (!query) return alert("검색할 약속장소를 입력하세요.");
            
            const pos = await fetchLocation(query);
            if (pos) {
                tempTargetPos = pos;
                const el = document.getElementById('search-result-text');
                el.innerText = `✓ '${pos.name}' 위치 지정 완료`;
                el.classList.remove('hidden');
            } else {
                alert("해당 장소를 찾을 수 없습니다.");
            }
        }

        function submitRoomCreation() {
            myNickName = document.getElementById('init-username').value.trim() || "모임장";
            const title = document.getElementById('init-roomtitle').value.trim() || "번개 모임";

            currentRoomId = Math.random().toString(36).substring(2, 8);
            window.history.replaceState({}, '', `?room=${currentRoomId}`);

            db.ref(`rooms/${currentRoomId}/info`).set({ title, owner: myNickName });
            if (tempTargetPos) {
                db.ref(`rooms/${currentRoomId}/target`).set(tempTargetPos);
            }

            document.getElementById('create-modal').classList.add('hidden');
            initApp();
        }

        function initApp() {
            document.getElementById('room-tag').innerText = `방: ${currentRoomId}`;

            // 기본 초기화 위치
            map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 15);
            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            // 실시간 내 GPS 자동 트래킹 및 내 위치로 중심 이동
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    const isFirst = (myPos === null);
                    myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    
                    document.getElementById('gps-status-text').className = "text-[11px] text-emerald-400 font-medium";
                    document.getElementById('gps-status-text').innerText = "🟢 실시간 GPS 수신 중";

                    syncMyLocation();

                    // 처음 위치를 잡았을 때 내 위치로 화면 자동 이동
                    if (isFirst) {
                        map.setView([myPos.lat, myPos.lng], 16);
                    }
                }, (err) => {
                    document.getElementById('gps-status-text').className = "text-[11px] text-rose-400 font-medium";
                    document.getElementById('gps-status-text').innerText = "⚠️ GPS 연결 안됨 (권한 허용 필요)";
                }, { enableHighAccuracy: true, timeout: 10000 });
            }

            // 모임원 마커 동기화
            db.ref(`rooms/${currentRoomId}/users`).on('value', (snapshot) => {
                const users = snapshot.val() || {};
                const uKeys = Object.keys(users);

                uKeys.forEach(uid => {
                    if (uid !== 'user_' + myNickName) {
                        const uData = users[uid];
                        if (uData.lat && uData.lng) {
                            if (!userMarkers[uid]) {
                                const icon = L.divIcon({ className: 'user-marker', html: uData.name ? uData.name[0] : '유' });
                                userMarkers[uid] = L.marker([uData.lat, uData.lng], { icon }).addTo(map);
                            } else {
                                userMarkers[uid].setLatLng([uData.lat, uData.lng]);
                            }
                        }
                    }
                });
            });

            // 약속 장소 핀 동기화
            db.ref(`rooms/${currentRoomId}/target`).on('value', (snapshot) => {
                const target = snapshot.val();
                if (target) {
                    if (targetMarker) map.removeLayer(targetMarker);
                    const icon = L.divIcon({ className: 'target-marker', html: '<i class="fa-solid fa-flag"></i>' });
                    targetMarker = L.marker([target.lat, target.lng], { icon }).addTo(map);
                    if (!myPos) map.setView([target.lat, target.lng], 15);
                }
            });

            // 실시간 채팅 동기화
            db.ref(`rooms/${currentRoomId}/chats`).limitToLast(10).on('child_added', (snapshot) => {
                const chat = snapshot.val();
                const chatBox = document.getElementById('chat-box');
                const msg = document.createElement('div');
                msg.innerHTML = `<span class="font-bold text-emerald-400">${chat.sender}:</span> ${chat.text}`;
                chatBox.appendChild(msg);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function syncMyLocation() {
            if (!myPos) return;
            const myUid = 'user_' + myNickName;
            if (!myMarker) {
                const icon = L.divIcon({ className: 'my-custom-marker', html: myNickName[0] });
                myMarker = L.marker([myPos.lat, myPos.lng], { icon }).addTo(map);
            } else {
                myMarker.setLatLng([myPos.lat, myPos.lng]);
            }
            db.ref(`rooms/${currentRoomId}/users/${myUid}`).set({
                name: myNickName, lat: myPos.lat, lng: myPos.lng
            });
        }

        function panToMyLocation() {
            if (myPos) {
                map.setView([myPos.lat, myPos.lng], 16);
            } else {
                alert("GPS 위치 정보를 받아오는 중입니다. 브라우저 위치 권한을 '허용'했는지 확인해 주세요.");
            }
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !currentRoomId) return;
            db.ref(`rooms/${currentRoomId}/chats`).push({ sender: myNickName, text });
            input.value = '';
        }

        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("초대 링크가 복사되었습니다! 카카오톡방에 공유하세요.");
        }

        function explodeRoom() {
            if (confirm("정말로 방을 폭파하시겠습니까? 방 안의 모든 실시간 데이터가 삭제됩니다.")) {
                if (currentRoomId) db.ref(`rooms/${currentRoomId}`).remove();
                alert("방이 정상 폭파되었습니다.");
                window.location.href = window.location.pathname;
            }
        }

        function openDutchPayModal() { document.getElementById('dutch-modal').classList.remove('hidden'); }
        function closeDutchModal() { document.getElementById('dutch-modal').classList.add('hidden'); }
        function calculateDutch() {
            const total = parseInt(document.getElementById('total-amount').value);
            const count = parseInt(document.getElementById('dutch-count').value);
            if (!total || !count) return alert("금액과 인원수를 정확히 입력해주세요.");
            const price = Math.ceil((total / count) / 100) * 100;
            document.getElementById('dutch-price').innerText = `${price.toLocaleString()} 원`;
            document.getElementById('dutch-result').classList.remove('hidden');
        }
    </script>
</body>
</html>
