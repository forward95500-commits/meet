<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>여기서 만나 - 실시간 약속장소 & 위치 메이트</title>
    <!-- Tailwind CSS & Leaflet -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Canvas Confetti (방 폭파 폭죽 효과) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase Realtime SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map { height: calc(100vh - 240px); width: 100%; z-index: 1; }
        @media (min-width: 768px) {
            #map { height: calc(100vh - 200px); }
        }
        .my-custom-marker {
            width: 32px; height: 32px; background-color: #10B981; border: 3px solid #ffffff;
            border-radius: 50%; box-shadow: 0 0 15px rgba(16, 185, 129, 0.9); text-align: center;
            line-height: 26px; color: white; font-weight: bold; font-size: 13px;
            animation: pulse 1.8s infinite; z-index: 1000 !important;
        }
        .user-marker {
            width: 28px; height: 28px; background-color: #3B82F6; border: 3px solid #ffffff;
            border-radius: 50%; box-shadow: 0 0 10px rgba(59, 130, 246, 0.7); text-align: center;
            line-height: 22px; color: white; font-weight: bold; font-size: 11px;
        }
        .target-marker {
            width: 36px; height: 36px; background-color: #EF4444; border: 3px solid #ffffff;
            border-radius: 50%; box-shadow: 0 0 16px rgba(239, 68, 68, 0.9); text-align: center;
            line-height: 30px; color: white; font-size: 16px; animation: bounce 1s infinite alternate;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
    </style>
</head>
<body class="bg-gray-900 text-slate-100 h-screen w-screen overflow-hidden flex flex-col">

    <!-- 📱 모바일 최적화 깔끔한 상단 헤더 -->
    <header class="bg-gray-800 border-b border-gray-700 px-3 py-2 flex items-center justify-between z-30 shadow-md">
        <div class="flex items-center gap-2">
            <div class="bg-emerald-500 text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm shadow">
                <i class="fa-solid fa-location-dot"></i>
            </div>
            <div>
                <div class="flex items-center gap-1.5">
                    <h1 id="room-title-display" class="text-sm font-bold text-white leading-tight">여기서 만나</h1>
                    <span id="room-tag" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] px-1.5 py-0.2 rounded font-mono">대기</span>
                </div>
                <p id="gps-status-text" class="text-[10px] text-amber-400">GPS 연결 중...</p>
            </div>
        </div>

        <div class="flex items-center gap-1">
            <button onclick="panToMyLocation()" class="bg-slate-700 hover:bg-slate-600 text-emerald-400 text-xs p-2 rounded-lg font-bold transition flex items-center gap-1" title="내 위치 찾기">
                <i class="fa-solid fa-crosshairs"></i>
            </button>
            <button onclick="copyShareLink()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-2.5 py-1.5 rounded-lg font-semibold transition flex items-center gap-1 shadow">
                <i class="fa-solid fa-share-nodes"></i> <span class="hidden sm:inline">초대</span>
            </button>
            <button onclick="explodeRoom()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs px-2.5 py-1.5 rounded-lg font-semibold transition flex items-center gap-1 shadow">
                <i class="fa-solid fa-bomb"></i> <span class="hidden sm:inline">방 폭파</span>
            </button>
        </div>
    </header>

    <!-- 1단계: 초기 모임방 개설 모달 -->
    <div id="create-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl max-w-sm w-full shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-emerald-600 to-teal-700 p-5 text-white">
                <span class="bg-black/20 text-emerald-100 text-[10px] font-bold px-2.5 py-0.5 rounded-full">📍 초간단 모임방 생성</span>
                <h2 class="text-xl font-black mt-2">여기서 만나</h2>
                <p class="text-xs text-emerald-100 mt-0.5">닉네임과 약속 장소를 입력하세요.</p>
            </div>
            <div class="p-5 space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">내 닉네임</label>
                    <input type="text" id="init-username" placeholder="예: 길동이" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">모임 이름</label>
                    <input type="text" id="init-roomtitle" placeholder="예: 번개 모임 ⚡" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">약속 장소 검색 (상호명/주소)</label>
                    <div class="flex gap-2">
                        <input type="text" id="init-target-input" placeholder="예: 스타벅스, 운암명가, 동탄역" class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" onkeypress="if(event.key==='Enter') searchInitTarget()">
                        <button onclick="searchInitTarget()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-2 rounded-xl text-xs transition">검색</button>
                    </div>
                </div>
                <button onclick="submitRoomCreation()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition text-xs flex items-center justify-center gap-1.5 mt-2">
                    <i class="fa-solid fa-rocket"></i> 모임방 바로 개설하기
                </button>
            </div>
        </div>
    </div>

    <!-- 🔍 상호명 검색 결과 지점 선택 목록 모달 -->
    <div id="search-results-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-4 max-w-sm w-full shadow-2xl flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-3 border-b border-gray-700 pb-2">
                <h3 class="text-xs font-bold text-white flex items-center gap-1.5"><i class="fa-solid fa-list-check text-emerald-400"></i> 원하는 지점을 선택하세요</h3>
                <button onclick="closeSearchResultsModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="search-list-container" class="overflow-y-auto space-y-2 flex-1 pr-1">
                <!-- 검색 결과 리스트가 여기에 자동 생성됩니다 -->
            </div>
        </div>
    </div>

    <!-- 2단계: 메인 인터페이스 (지도 + 하단 채팅 & 회비 정산) -->
    <main class="flex-1 flex flex-col relative w-full h-full overflow-hidden">
        <!-- 지도 영역 -->
        <div id="map"></div>

        <!-- 하단 영역: 실시간 채팅 & 회비 정산 탭 -->
        <div class="bg-gray-800 border-t border-gray-700 p-3 flex-1 flex flex-col gap-2 z-20 shadow-2xl">
            <!-- 회비 정산 바 -->
            <div class="bg-gray-900 border border-gray-700 rounded-xl p-2 flex items-center justify-between text-xs">
                <div class="flex items-center gap-1.5 text-amber-400 font-bold">
                    <i class="fa-solid fa-calculator"></i> 회비 정산
                </div>
                <div class="flex items-center gap-1.5">
                    <input type="number" id="quick-total" placeholder="총금액(원)" class="w-20 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-white text-[11px] focus:outline-none">
                    <input type="number" id="quick-count" value="3" class="w-10 bg-gray-800 border border-gray-700 rounded px-1.5 py-1 text-white text-[11px] text-center focus:outline-none">
                    <button onclick="calcQuickDutch()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-2.5 py-1 rounded text-[11px]">계산</button>
                </div>
                <span id="quick-dutch-res" class="text-amber-300 font-black text-xs hidden">0원</span>
            </div>

            <!-- 실시간 채팅창 -->
            <div class="flex-1 flex flex-col min-h-0 bg-gray-900 border border-gray-700 rounded-xl p-2">
                <div id="chat-box" class="flex-1 overflow-y-auto text-xs text-gray-300 flex flex-col gap-1 pr-1 font-sans">
                    <div class="text-emerald-400 font-semibold">👋 실시간 모임방입니다! 링크를 복사하여 메이트들을 초대하세요.</div>
                </div>
                <div class="flex gap-1.5 mt-1.5">
                    <input type="text" id="chat-input" placeholder="메시지 입력..." class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-emerald-500" onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded-lg text-xs font-bold">전송</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = { databaseURL: "https://meet-here-default-rtdb.asia-southeast1.firebasedatabase.app" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let map, myMarker, targetMarker;
        let userMarkers = {};
        let myPos = null;
        let tempTargetPos = null;
        let currentRoomId = null;
        let myNickName = "나";

        const urlParams = new URLSearchParams(window.location.search);
        const roomIdParam = urlParams.get('room');

        window.onload = () => {
            if (roomIdParam) {
                currentRoomId = roomIdParam;
                document.getElementById('create-modal').classList.add('hidden');
                myNickName = prompt("모임방 참여 닉네임을 입력해주세요:", "길동이") || "참여자";
                initApp();
            }
        };

        // 💡 국내 모든 상호명 검색 및 다중 지점 결과 모달 로직
        async function searchInitTarget() {
            const query = document.getElementById('init-target-input').value.trim();
            if (!query) return alert("검색할 약속장소를 입력하세요.");

            try {
                const kakaoRes = await fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(query)}`, {
                    headers: { Authorization: "KakaoAK 23a9d94185bc0aa8c33a4d334546682b" }
                });

                if (kakaoRes.ok) {
                    const kData = await kakaoRes.json();
                    if (kData.documents && kData.documents.length > 0) {
                        displaySearchResults(kData.documents);
                        return;
                    }
                }
            } catch (e) {}

            alert("해당 장소나 지점을 찾을 수 없습니다.");
        }

        function displaySearchResults(items) {
            const container = document.getElementById('search-list-container');
            container.innerHTML = '';

            items.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "bg-gray-900 border border-gray-700 hover:border-emerald-500 p-2.5 rounded-xl cursor-pointer transition flex justify-between items-center";
                div.onclick = () => selectPlace(item);

                div.innerHTML = `
                    <div>
                        <div class="text-xs font-bold text-white">${item.place_name}</div>
                        <div class="text-[10px] text-gray-400 mt-0.5">${item.road_address_name || item.address_name}</div>
                    </div>
                    <span class="text-[10px] bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 px-2 py-1 rounded-lg">선택</span>
                `;
                container.appendChild(div);
            });

            document.getElementById('search-results-modal').classList.remove('hidden');
        }

        function selectPlace(item) {
            tempTargetPos = { lat: parseFloat(item.y), lng: parseFloat(item.x), name: item.place_name };
            alert(`'${item.place_name}' 지점이 약속장소로 선택되었습니다!`);
            closeSearchResultsModal();
        }

        function closeSearchResultsModal() {
            document.getElementById('search-results-modal').classList.add('hidden');
        }

        function submitRoomCreation() {
            myNickName = document.getElementById('init-username').value.trim() || "모임장";
            const title = document.getElementById('init-roomtitle').value.trim() || "번개 모임";

            currentRoomId = Math.random().toString(36).substring(2, 8);
            window.history.replaceState({}, '', `?room=${currentRoomId}`);

            db.ref(`rooms/${currentRoomId}/info`).set({ title, owner: myNickName });
            if (tempTargetPos) {
                db.ref(`rooms/${currentRoomId}/target`).set(tempTargetPos);
            }

            document.getElementById('create-modal').classList.add('hidden');
            initApp();
        }

        function initApp() {
            document.getElementById('room-tag').innerText = `방: ${currentRoomId}`;

            map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 15);
            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            // 방 정보 가져오기
            db.ref(`rooms/${currentRoomId}/info`).once('value', snapshot => {
                const info = snapshot.val() || {};
                if (info.title) document.getElementById('room-title-display').innerText = info.title;
            });

            // 실시간 GPS 추적
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    const isFirst = (myPos === null);
                    myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    
                    document.getElementById('gps-status-text').className = "text-[10px] text-emerald-400 font-medium";
                    document.getElementById('gps-status-text').innerText = "🟢 GPS 연결됨";

                    syncMyLocation();

                    if (isFirst) map.setView([myPos.lat, myPos.lng], 16);
                }, (err) => {
                    document.getElementById('gps-status-text').className = "text-[10px] text-rose-400 font-medium";
                    document.getElementById('gps-status-text').innerText = "⚠️ GPS 권한 필요";
                }, { enableHighAccuracy: true, timeout: 10000 });
            }

            // 모임원 마커 동기화
            db.ref(`rooms/${currentRoomId}/users`).on('value', (snapshot) => {
                const users = snapshot.val() || {};
                Object.keys(users).forEach(uid => {
                    if (uid !== 'user_' + myNickName) {
                        const uData = users[uid];
                        if (uData.lat && uData.lng) {
                            if (!userMarkers[uid]) {
                                const icon = L.divIcon({ className: 'user-marker', html: uData.name ? uData.name[0] : '유' });
                                userMarkers[uid] = L.marker([uData.lat, uData.lng], { icon }).addTo(map);
                            } else {
                                userMarkers[uid].setLatLng([uData.lat, uData.lng]);
                            }
                        }
                    }
                });
            });

            // 약속 장소 핀 동기화
            db.ref(`rooms/${currentRoomId}/target`).on('value', (snapshot) => {
                const target = snapshot.val();
                if (target) {
                    if (targetMarker) map.removeLayer(targetMarker);
                    const icon = L.divIcon({ className: 'target-marker', html: '<i class="fa-solid fa-flag"></i>' });
                    targetMarker = L.marker([target.lat, target.lng], { icon }).addTo(map);
                    if (!myPos) map.setView([target.lat, target.lng], 15);
                }
            });

            // 실시간 채팅 동기화
            db.ref(`rooms/${currentRoomId}/chats`).limitToLast(10).on('child_added', (snapshot) => {
                const chat = snapshot.val();
                const chatBox = document.getElementById('chat-box');
                const msg = document.createElement('div');
                msg.innerHTML = `<span class="font-bold text-emerald-400">${chat.sender}:</span> ${chat.text}`;
                chatBox.appendChild(msg);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function syncMyLocation() {
            if (!myPos) return;
            const myUid = 'user_' + myNickName;
            if (!myMarker) {
                const icon = L.divIcon({ className: 'my-custom-marker', html: myNickName[0] });
                myMarker = L.marker([myPos.lat, myPos.lng], { icon }).addTo(map);
            } else {
                myMarker.setLatLng([myPos.lat, myPos.lng]);
            }
            db.ref(`rooms/${currentRoomId}/users/${myUid}`).set({
                name: myNickName, lat: myPos.lat, lng: myPos.lng
            });
        }

        function panToMyLocation() {
            if (myPos) map.setView([myPos.lat, myPos.lng], 16);
            else alert("GPS 위치 수신 중입니다.");
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !currentRoomId) return;
            db.ref(`rooms/${currentRoomId}/chats`).push({ sender: myNickName, text });
            input.value = '';
        }

        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("초대 링크가 복사되었습니다! 카카오톡에 전송해 보세요.");
        }

        // 💥 방 폭파 시 폭죽 터지는 효과 연동
        function explodeRoom() {
            if (confirm("정말로 방을 폭파하시겠습니까? 방이 지워지고 폭죽이 터집니다!")) {
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.6 }
                });

                if (currentRoomId) db.ref(`rooms/${currentRoomId}`).remove();

                setTimeout(() => {
                    alert("방이 정상 삭제되었습니다.");
                    window.location.href = window.location.pathname;
                }, 1500);
            }
        }

        function calcQuickDutch() {
            const total = parseInt(document.getElementById('quick-total').value);
            const count = parseInt(document.getElementById('quick-count').value);
            if (!total || !count) return alert("금액과 인원을 정확히 입력하세요.");
            const price = Math.ceil((total / count) / 100) * 100;
            const resEl = document.getElementById('quick-dutch-res');
            resEl.innerText = `1인당 ${price.toLocaleString()}원`;
            resEl.classList.remove('hidden');
        }
    </script>
</body>
</html>
