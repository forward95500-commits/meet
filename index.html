<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>여기서 만나 - 스마트 실시간 약속 플랫폼</title>
    <!-- Pretendard 웹 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Tailwind CSS & Leaflet -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase Realtime SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100dvh;
            overflow: hidden;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #113832 !important;
        }
        #map { width: 100%; z-index: 1; background-color: #f8fafc !important; }

        /* 지도 마커 스타일 */
        .my-custom-marker {
            width: 32px; height: 32px; background-color: #10B981; border: 3px solid #ffffff;
            border-radius: 50%; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); text-align: center;
            line-height: 26px; color: white; font-weight: 800; font-size: 13px;
            animation: pulse 1.8s infinite; z-index: 1000 !important;
        }
        .user-marker {
            width: 30px; height: 30px; background-color: #3B82F6; border: 3px solid #ffffff;
            border-radius: 50%; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); text-align: center;
            line-height: 24px; color: white; font-weight: 700; font-size: 12px; cursor: pointer;
        }
        .target-marker {
            width: 36px; height: 36px; background-color: #EF4444; border: 3px solid #ffffff;
            border-radius: 50%; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); text-align: center;
            line-height: 30px; color: white; font-size: 16px; animation: bounce 1s infinite alternate;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }

        /* 밝고 화사한 라이트 그리드 배너 */
        .bright-grid-banner {
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(at 10% 20%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                linear-gradient(rgba(203, 213, 225, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(203, 213, 225, 0.4) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
            animation: gridMove 16s linear infinite;
        }
        @keyframes gridMove {
            0% { background-position: 0 0, 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 28px 28px, 28px 28px; }
        }
        .char-bounce { animation: charHop 2.2s ease-in-out infinite; }
        @keyframes charHop {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-5px) rotate(1deg); }
        }
        .radar-ping {
            position: absolute; border-radius: 50%; border: 2px solid rgba(16, 185, 129, 0.5);
            animation: radarPulse 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }
        @keyframes radarPulse {
            0% { width: 20px; height: 20px; opacity: 1; }
            100% { width: 140px; height: 140px; opacity: 0; }
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-screen overflow-hidden text-slate-800 antialiased">

    <!-- 상단 대시보드 상태바 -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 px-3 py-2 flex items-center justify-between z-30 shadow-sm shrink-0 gap-2 overflow-x-auto">
        <div class="flex items-center gap-2 shrink-0">
            <div class="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-xl font-extrabold text-xs flex items-center gap-1 border border-emerald-300 shadow-sm">
                <i class="fa-solid fa-users"></i> <span id="room-title-display">모임명: 여기서만나</span>
            </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
            <div class="hidden sm:flex bg-slate-100 px-2.5 py-1 rounded-xl text-xs font-bold text-slate-700 border border-slate-200 items-center gap-1">
                <i class="fa-solid fa-calendar-days text-amber-500"></i> <span id="header-meet-time">시간 대기중</span>
            </div>
            <button onclick="toggleGPSSharing()" id="toggle-gps-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs px-2.5 py-1 rounded-xl font-bold transition shadow-sm flex items-center gap-1">
                <i class="fa-solid fa-satellite-dish"></i> ON
            </button>
            <button onclick="copyShareLink()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-2.5 py-1 rounded-xl font-bold transition shadow-sm flex items-center gap-1">
                <i class="fa-solid fa-share-nodes"></i> 초대
            </button>
            <button id="explode-btn" onclick="explodeRoom()" class="hidden bg-rose-500 hover:bg-rose-600 text-white text-xs px-2.5 py-1 rounded-xl font-bold transition shadow-sm">
                폭파
            </button>
        </div>
    </header>

    <!-- 📱 1단계: 모임 개설 모달 -->
    <div id="create-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-sm w-full shadow-2xl my-auto overflow-hidden">
            <div class="relative h-40 bright-grid-banner flex flex-col justify-between p-4 text-slate-800 overflow-hidden">
                <div class="flex justify-between items-start z-10">
                    <div class="inline-flex items-center gap-1 bg-white/90 backdrop-blur-md text-emerald-700 text-[10px] font-extrabold px-2 py-0.5 rounded-full border border-emerald-200 shadow-sm">
                        <i class="fa-solid fa-map-location-dot text-emerald-600"></i> 실시간 모임 지도
                    </div>
                </div>
                <div class="relative flex items-center justify-center my-0 z-10">
                    <div class="radar-ping"></div>
                    <div class="char-bounce bg-white/95 text-slate-900 px-3.5 py-2 rounded-2xl shadow-xl border border-emerald-200 flex items-center gap-2.5 backdrop-blur-md">
                        <div class="w-7 h-7 bg-emerald-500 text-white rounded-full flex items-center justify-center text-xs font-black shadow-md">
                            <i class="fa-solid fa-location-crosshairs"></i>
                        </div>
                        <div class="text-left">
                            <div class="text-xs font-extrabold text-emerald-600 leading-tight">스마트 약속 모임</div>
                            <div class="text-[10px] text-slate-500">내 친구 실시간 위치 한눈에</div>
                        </div>
                    </div>
                </div>
                <div class="relative z-10">
                    <h2 class="text-lg font-black tracking-tight text-slate-900">여기서 만나</h2>
                    <p class="text-[10px] text-slate-600 font-medium">위치 공유부터 1/N 회비 정산까지 손쉽게!</p>
                </div>
            </div>

            <div class="p-4 space-y-2.5 bg-white">
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-0.5"><i class="fa-solid fa-users text-emerald-500"></i> 1. 모임 이름</label>
                    <input type="text" id="init-roomtitle" placeholder="예: 주말 모임 ☕" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-emerald-500">
                </div>

                <div class="relative">
                    <label class="block text-[11px] font-bold text-slate-700 mb-0.5"><i class="fa-solid fa-location-dot text-rose-500"></i> 2. 약속장소 (상호명 또는 주소)</label>
                    <div class="flex gap-1.5">
                        <input type="text" id="init-target-input" placeholder="예: 병점역, 이삭토스트" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-emerald-500" onkeypress="if(event.key==='Enter') searchPlaces()">
                        <button type="button" onclick="searchPlaces()" class="bg-slate-100 text-emerald-600 border border-emerald-200 font-bold px-3 py-2 rounded-xl text-xs active:scale-95 transition shadow-sm">검색</button>
                    </div>
                    <!-- 장소 검색 드롭다운 -->
                    <div id="search-dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-2xl shadow-xl max-h-48 overflow-y-auto z-50 p-1 space-y-1"></div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-0.5"><i class="fa-solid fa-user-group text-indigo-500"></i> 3. 정원</label>
                        <select id="init-maxmembers" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-xs text-slate-800 focus:outline-none focus:border-emerald-500">
                            <option value="2">2명</option>
                            <option value="3" selected>3명</option>
                            <option value="4">4명</option>
                            <option value="5">5명</option>
                            <option value="10">10명</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-700 mb-0.5"><i class="fa-solid fa-calendar-days text-amber-500"></i> 4. 약속 시간</label>
                        <input type="datetime-local" id="init-meettime" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2 py-2 text-[10px] text-slate-800 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-700 mb-0.5"><i class="fa-solid fa-user text-emerald-500"></i> 5. 내 이름 (닉네임)</label>
                    <input type="text" id="init-username" placeholder="예: 홍길동" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-emerald-500">
                </div>

                <button type="button" onclick="submitRoomCreation()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-extrabold py-3 rounded-xl shadow-lg transition text-xs flex items-center justify-center gap-1.5 mt-1 cursor-pointer">
                    <i class="fa-solid fa-rocket"></i> 모임방 바로 개설하기
                </button>
            </div>
        </div>
    </div>

    <!-- 💌 2단계: 초대받은 지인 모임 참여 모달 -->
    <div id="join-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-sm w-full shadow-2xl my-auto overflow-hidden">
            <div class="bg-gradient-to-br from-indigo-600 via-teal-600 to-emerald-600 p-4 text-white text-center">
                <div class="inline-flex items-center gap-1 bg-white/20 text-white text-[10px] font-bold px-2 py-0.5 rounded-full mb-1">
                    <i class="fa-solid fa-envelope-open-text text-amber-300"></i> 초대장
                </div>
                <h2 id="join-room-title" class="text-lg font-black tracking-tight text-white truncate">모임에 초대되었습니다!</h2>
            </div>
            <div class="p-4 space-y-3 bg-white">
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-1.5 text-xs">
                    <div class="flex items-center gap-2 text-slate-700">
                        <i class="fa-solid fa-location-dot text-rose-500 w-4 text-center"></i>
                        <span class="font-bold">약속장소:</span> <span id="join-target-name" class="font-semibold text-slate-900 truncate">지정 중...</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">모임에서 사용할 내 닉네임</label>
                    <input type="text" id="join-username" placeholder="예: 길동이" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800">
                </div>
                <button type="button" onclick="submitRoomJoin()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-extrabold py-3 rounded-xl shadow-lg transition text-xs flex items-center justify-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-right-to-bracket"></i> 모임방 지도로 참여하기
                </button>
            </div>
        </div>
    </div>

    <!-- 💰 1/N 정산 계산 모달 -->
    <div id="dutch-modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-2xl p-4 max-w-xs w-full shadow-2xl flex flex-col gap-2.5">
            <div class="flex justify-between items-center border-b border-slate-100 pb-1.5">
                <h3 class="text-xs font-bold text-amber-600"><i class="fa-solid fa-calculator"></i> 1/N 정산</h3>
                <button onclick="closeDutchModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div>
                <p id="dutch-modal-info" class="text-xs text-slate-600 mb-1 font-medium"></p>
                <label class="block text-[11px] font-bold text-slate-500 mb-0.5">정산 참여 인원수</label>
                <input type="number" id="dutch-member-count" value="3" min="1" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-800">
            </div>
            <button onclick="confirmDutchCalculation()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 rounded-xl text-xs transition">계산하기</button>
            <div id="dutch-modal-result" class="hidden bg-amber-50 border border-amber-200 p-2 rounded-xl text-center text-xs text-amber-700 font-bold"></div>
        </div>
    </div>

    <!-- 메인 레이아웃 -->
    <main class="flex-1 flex flex-col md:flex-row relative w-full h-full overflow-hidden">
        
        <!-- 지도 영역 + 우측 하단 '내 위치' 버튼 -->
        <div id="map" class="flex-1 relative h-[55%] md:h-full">
            <button onclick="panToMyLocation()" class="absolute bottom-4 right-4 z-[400] bg-[#0d9488] hover:bg-[#0f766e] text-white px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2 font-extrabold text-sm transition active:scale-95 border border-emerald-400/40">
                <i class="fa-solid fa-crosshairs text-base"></i> 내 위치
            </button>
        </div>

        <!-- 우측 / 하단 제어 패널 (채팅창 + 회비 장부) -->
        <aside class="w-full md:w-80 bg-white/95 backdrop-blur-md border-t md:border-t-0 md:border-l border-slate-200 p-3 flex flex-col gap-2.5 z-20 shadow-xl overflow-y-auto shrink-0 h-[45%] md:h-full">
            
            <!-- 💬 실시간 채팅창 -->
            <div class="flex-1 flex flex-col min-h-[110px] bg-slate-50 border border-slate-200 rounded-2xl p-2.5 shadow-sm">
                <div class="text-[11px] font-bold text-slate-700 mb-1 flex items-center gap-1">
                    <i class="fa-solid fa-comments text-emerald-600"></i> 실시간 채팅
                </div>
                <div id="chat-box" class="flex-1 overflow-y-auto text-xs text-slate-700 flex flex-col gap-1 pr-1 font-sans">
                    <div class="text-emerald-600 font-bold">👋 위치 공유방 채팅입니다!</div>
                </div>
                <div class="flex gap-1 mt-1.5">
                    <input type="text" id="chat-input" placeholder="메시지 입력..." class="flex-1 bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 focus:outline-none focus:border-emerald-500" onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">전송</button>
                </div>
            </div>

            <!-- 📒 모임 회비 장부 & 1/N 정산 -->
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-2.5 flex flex-col gap-2">
                <div class="flex justify-between items-center border-b border-slate-200 pb-1">
                    <span class="text-xs font-bold text-amber-600 flex items-center gap-1"><i class="fa-solid fa-receipt"></i> 모임 회비 장부</span>
                    <select id="dutch-stage" class="bg-white border border-slate-200 text-amber-700 text-[11px] rounded px-1.5 py-0.5 font-bold">
                        <option value="1차">1차</option>
                        <option value="2차">2차</option>
                        <option value="3차">3차</option>
                        <option value="4차">4차</option>
                        <option value="5차">5차</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <input type="text" id="payer-name" placeholder="결제자 이름" class="bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-800">
                    <input type="number" id="stage-total" placeholder="결제 금액(원)" class="bg-white border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-800">
                </div>
                <div class="flex gap-1.5">
                    <button onclick="savePaymentOnly()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-1.5 rounded-lg text-xs transition">지출 기록추가</button>
                    <button onclick="openDutchModal()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-1.5 rounded-lg text-xs transition shadow-sm">1/N 정산하기</button>
                </div>
                <div class="border-t border-slate-200 pt-1.5 flex justify-between items-center text-xs">
                    <span class="font-bold text-slate-500">누적 지출 합계</span>
                    <span id="total-expense-badge" class="font-extrabold text-amber-600">총 0원</span>
                </div>
                <div id="payment-history-list" class="space-y-1 max-h-20 overflow-y-auto pr-1">
                    <div class="text-[10px] text-slate-400 text-center py-1">등록된 지출 내역이 없습니다.</div>
                </div>
            </div>
        </aside>
    </main>

    <!-- 🟢 하단 고정: '모임원 도착 현황' 패널 (목적지 기준 가까운 거리순 자동정렬) -->
    <footer class="bg-[#113832] border-t border-emerald-900/50 p-3 z-30 shadow-2xl shrink-0 flex flex-col gap-1.5">
        <div class="flex items-center justify-between px-1">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-lg bg-emerald-700/60 text-emerald-300 flex items-center justify-center text-[11px]">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <h3 class="text-xs font-black text-white tracking-wide">모임원 도착 현황 (가까운 순)</h3>
                </div>
            </div>
            <span id="member-count-badge" class="text-[10px] font-extrabold text-emerald-300 bg-emerald-900/80 px-2 py-0.5 rounded-full border border-emerald-700/50">1명 참여</span>
        </div>

        <!-- 모임원 카드 슬라이더 -->
        <div id="member-items-container" class="flex gap-2 overflow-x-auto pb-1 pt-0.5 scrollbar-thin">
            <div class="bg-[#1f4e47] border border-emerald-700/40 px-3 py-1.5 rounded-xl flex items-center gap-2.5 text-xs shadow-md shrink-0 min-w-[150px]">
                <div class="w-6 h-6 rounded-full bg-emerald-500 text-white font-bold flex items-center justify-center text-[11px] shadow">나</div>
                <div>
                    <div class="font-extrabold text-white text-[11px]">나 (접속중)</div>
                    <div class="text-[10px] text-emerald-300 font-medium">위치 확인 중</div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const firebaseConfig = { databaseURL: "https://meet-here-default-rtdb.asia-southeast1.firebasedatabase.app" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let map, myMarker, targetMarker;
        let userMarkers = {};
        let myPos = null, tempTargetPos = null, targetPos = null;
        let currentRoomId = null, myNickName = "나", isSharingGPS = true, watchId = null;
        let paymentHistory = [];

        document.getElementById('init-meettime').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);

        const urlParams = new URLSearchParams(window.location.search);
        const roomIdParam = urlParams.get('room');

        window.onload = () => {
            if (roomIdParam) {
                currentRoomId = roomIdParam;
                document.getElementById('create-modal').classList.add('hidden');
                document.getElementById('join-modal').classList.remove('hidden');

                db.ref(`rooms/${currentRoomId}/info`).once('value', snapshot => {
                    const info = snapshot.val() || {};
                    if (info.title) {
                        document.getElementById('join-room-title').innerText = info.title;
                        document.getElementById('room-title-display').innerText = `모임: ${info.title}`;
                    }
                });
                db.ref(`rooms/${currentRoomId}/target`).once('value', snapshot => {
                    const target = snapshot.val();
                    if (target && target.name) {
                        document.getElementById('join-target-name').innerText = target.name;
                    }
                });
            }
        };

        function submitRoomJoin() {
            myNickName = document.getElementById('join-username').value.trim() || "참여자";
            document.getElementById('join-modal').classList.add('hidden');
            initApp();
        }

        /* 🔍 장소 검색 기능 (Nominatim 안정 연동) */
        async function searchPlaces() {
            const rawQuery = document.getElementById('init-target-input').value.trim();
            if (!rawQuery) return alert("검색어를 입력하세요.");
            const dropdown = document.getElementById('search-dropdown');
            dropdown.innerHTML = '<div class="p-2 text-center text-xs text-slate-400">검색 중...</div>';
            dropdown.classList.remove('hidden');

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(rawQuery)}&countrycodes=kr&accept-language=ko&limit=5`);
                const data = await res.json();
                dropdown.innerHTML = '';
                if(data.length === 0) {
                    dropdown.innerHTML = '<div class="p-2 text-center text-xs text-rose-500">결과가 없습니다.</div>';
                    return;
                }
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "p-2 hover:bg-slate-100 cursor-pointer rounded-xl text-xs font-semibold text-slate-800 border-b border-slate-100 last:border-0";
                    div.onclick = () => {
                        tempTargetPos = { lat: parseFloat(item.lat), lng: parseFloat(item.lon), name: item.display_name.split(',')[0] };
                        document.getElementById('init-target-input').value = tempTargetPos.name;
                        dropdown.classList.add('hidden');
                    };
                    div.innerText = item.display_name;
                    dropdown.appendChild(div);
                });
            } catch(e) { dropdown.innerHTML = '<div class="p-2 text-center text-xs text-rose-500">검색 오류</div>'; }
        }

        function submitRoomCreation() {
            myNickName = document.getElementById('init-username').value.trim();
            if (!myNickName) {
                alert("내 이름(닉네임)을 입력해주세요!");
                document.getElementById('init-username').focus();
                return;
            }

            const title = document.getElementById('init-roomtitle').value.trim() || "즐거운 모임 ⚡";
            const maxMem = document.getElementById('init-maxmembers').value;
            const meetTime = document.getElementById('init-meettime').value;

            currentRoomId = Math.random().toString(36).substring(2, 8);
            window.history.replaceState({}, '', `?room=${currentRoomId}`);
            document.getElementById('explode-btn').classList.remove('hidden');

            db.ref(`rooms/${currentRoomId}/info`).set({ title, owner: myNickName, max: maxMem, time: meetTime });
            if (tempTargetPos) {
                db.ref(`rooms/${currentRoomId}/target`).set(tempTargetPos);
            } else {
                const defaultTarget = { name: "서울시청", lat: 37.5665, lng: 126.9780 };
                db.ref(`rooms/${currentRoomId}/target`).set(defaultTarget);
            }

            document.getElementById('room-title-display').innerText = `모임: ${title}`;
            document.getElementById('create-modal').classList.add('hidden');
            initApp();
        }

        function initApp() {
            map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 15);
            L.control.zoom({ position: 'topright' }).addTo(map);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            startGPSWatch();

            // 회비 장부 실시간 연동
            db.ref(`rooms/${currentRoomId}/payments`).on('value', (snapshot) => {
                paymentHistory = snapshot.val() || [];
                renderPaymentHistory();
            });

            // 모임원 현황 실시간 수신 및 목적지 기준 가까운 거리순 정렬
            db.ref(`rooms/${currentRoomId}/users`).on('value', (snapshot) => {
                const users = snapshot.val() || {};
                const uKeys = Object.keys(users);
                document.getElementById('member-count-badge').innerText = `${uKeys.length}명 참여`;

                let userList = [];
                uKeys.forEach(uid => {
                    const uData = users[uid];
                    if (uData.lat && uData.lng) {
                        let distanceKm = 99999;
                        if (targetPos) {
                            distanceKm = getDistanceInKm(uData.lat, uData.lng, targetPos.lat, targetPos.lng);
                        }
                        userList.push({ uid, ...uData, distanceKm });
                    }
                });

                // 목적지 기준 가까운 순서로 정렬
                userList.sort((a, b) => a.distanceKm - b.distanceKm);

                const container = document.getElementById('member-items-container');
                container.innerHTML = '';

                userList.forEach(u => {
                    let distText = "위치 확인 중";
                    if (targetPos) {
                        distText = u.distanceKm < 1 ? `약 ${Math.round(u.distanceKm * 1000)}m 남음` : `약 ${u.distanceKm.toFixed(1)}km 남음`;
                    }

                    const card = document.createElement('div');
                    card.className = "bg-[#1f4e47] border border-emerald-700/40 px-3 py-1.5 rounded-xl flex items-center gap-2.5 text-xs shadow-md shrink-0 min-w-[150px] cursor-pointer hover:border-emerald-400 transition";
                    card.onclick = () => map.setView([u.lat, u.lng], 17);
                    card.innerHTML = `
                        <div class="w-6 h-6 rounded-full bg-indigo-500 text-white font-bold flex items-center justify-center text-[11px] shadow">${u.name[0]}</div>
                        <div>
                            <div class="font-extrabold text-white truncate max-w-[90px] text-[11px]">${u.name}</div>
                            <div class="text-[10px] text-emerald-300 font-semibold">${distText}</div>
                        </div>
                    `;
                    container.appendChild(card);

                    if (u.uid !== 'user_' + myNickName) {
                        if (!userMarkers[u.uid]) {
                            const icon = L.divIcon({ className: 'user-marker', html: u.name[0] });
                            userMarkers[u.uid] = L.marker([u.lat, u.lng], { icon }).addTo(map);
                        } else {
                            userMarkers[u.uid].setLatLng([u.lat, u.lng]);
                        }
                    }
                });
            });

            db.ref(`rooms/${currentRoomId}/target`).on('value', (snapshot) => {
                const target = snapshot.val();
                if (target) {
                    targetPos = target;
                    if (targetMarker) map.removeLayer(targetMarker);
                    const icon = L.divIcon({ className: 'target-marker', html: '<i class="fa-solid fa-flag"></i>' });
                    targetMarker = L.marker([target.lat, target.lng], { icon }).addTo(map);
                    if (!myPos) map.setView([target.lat, target.lng], 15);
                }
            });

            // 실시간 채팅 수신
            db.ref(`rooms/${currentRoomId}/chats`).limitToLast(15).on('child_added', (snapshot) => {
                const chat = snapshot.val();
                const chatBox = document.getElementById('chat-box');
                const msg = document.createElement('div');
                msg.innerHTML = `<span class="font-bold text-emerald-600">${chat.sender}:</span> ${chat.text}`;
                chatBox.appendChild(msg);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function startGPSWatch() {
            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition((pos) => {
                    if (!isSharingGPS) return;
                    const isFirst = (myPos === null);
                    myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    syncMyLocation();
                    if (isFirst) map.setView([myPos.lat, myPos.lng], 16);
                }, () => {}, { enableHighAccuracy: true });
            }
        }

        let isSharingGPS = true;
        function toggleGPSSharing() {
            isSharingGPS = !isSharingGPS;
            const btn = document.getElementById('toggle-gps-btn');
            btn.className = isSharingGPS ? "bg-emerald-500 text-white text-xs px-2.5 py-1 rounded-xl font-bold transition shadow-sm" : "bg-slate-300 text-slate-600 text-xs px-2.5 py-1 rounded-xl font-bold transition";
            btn.innerHTML = isSharingGPS ? `<i class="fa-solid fa-satellite-dish"></i> ON` : `<i class="fa-solid fa-ban"></i> OFF`;
        }

        function syncMyLocation() {
            if (!myPos || !isSharingGPS || !currentRoomId) return;
            db.ref(`rooms/${currentRoomId}/users/user_${myNickName}`).set({ name: myNickName, lat: myPos.lat, lng: myPos.lng });
            if (!myMarker) {
                const icon = L.divIcon({ className: 'my-custom-marker', html: myNickName[0] });
                myMarker = L.marker([myPos.lat, myPos.lng], { icon }).addTo(map);
            } else {
                myMarker.setLatLng([myPos.lat, myPos.lng]);
            }
        }

        function panToMyLocation() {
            if (myPos) map.setView([myPos.lat, myPos.lng], 16);
            else alert("GPS 위치 수신 대기 중입니다.");
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !currentRoomId) return;
            db.ref(`rooms/${currentRoomId}/chats`).push({ sender: myNickName, text });
            input.value = '';
        }

        function savePaymentOnly() {
            const stage = document.getElementById('dutch-stage').value;
            const payer = document.getElementById('payer-name').value.trim() || "결제자";
            const total = parseInt(document.getElementById('stage-total').value);
            if (!total) return alert("결제 금액을 입력하세요.");

            paymentHistory.push({ stage, payer, total });
            if (currentRoomId) db.ref(`rooms/${currentRoomId}/payments`).set(paymentHistory);
            else renderPaymentHistory();

            document.getElementById('payer-name').value = '';
            document.getElementById('stage-total').value = '';
        }

        function renderPaymentHistory() {
            const container = document.getElementById('payment-history-list');
            container.innerHTML = '';
            if (paymentHistory.length === 0) {
                container.innerHTML = '<div class="text-[10px] text-slate-400 text-center py-1">등록된 지출 내역이 없습니다.</div>';
                document.getElementById('total-expense-badge').innerText = '총 0원';
                return;
            }
            let sum = 0;
            paymentHistory.forEach(item => {
                sum += item.total;
                const div = document.createElement('div');
                div.className = "bg-white border border-slate-200 px-2 py-1 rounded-lg flex justify-between items-center text-[11px]";
                div.innerHTML = `<span class="font-bold text-slate-700">[${item.stage}] ${item.payer}</span><span class="font-extrabold text-amber-600">${item.total.toLocaleString()}원</span>`;
                container.appendChild(div);
            });
            document.getElementById('total-expense-badge').innerText = `총 ${sum.toLocaleString()}원`;
        }

        function openDutchModal() {
            const sum = paymentHistory.reduce((a,c)=>a+c.total,0);
            if (!sum) return alert("먼저 지출 내역을 등록하세요.");
            document.getElementById('dutch-modal-info').innerText = `총 누적 지출: ${sum.toLocaleString()}원`;
            document.getElementById('dutch-modal-result').classList.add('hidden');
            document.getElementById('dutch-modal').classList.remove('hidden');
        }

        function confirmDutchCalculation() {
            const sum = paymentHistory.reduce((a,c)=>a+c.total,0);
            const count = parseInt(document.getElementById('dutch-member-count').value) || 1;
            const price = Math.ceil((sum / count) / 100) * 100;
            const res = document.getElementById('dutch-modal-result');
            res.innerText = `1인당 정산 금액: ${price.toLocaleString()} 원`;
            res.classList.remove('hidden');
        }

        function closeDutchModal() { document.getElementById('dutch-modal').classList.add('hidden'); }

        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("초대 링크가 복사되었습니다!");
        }

        function explodeRoom() {
            if (confirm("방을 폭파하시겠습니까?")) {
                if (currentRoomId) db.ref(`rooms/${currentRoomId}`).remove();
                window.location.href = window.location.pathname;
            }
        }

        function getDistanceInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }
    </script>
</body>
