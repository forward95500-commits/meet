<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여기서 만나 - 실시간 약속장소 & 위치 메이트</title>
    <!-- Tailwind CSS & Leaflet -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Realtime SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        #map { height: calc(100vh - 130px); width: 100%; z-index: 1; }
        .user-marker {
            width: 30px; height: 30px; background-color: #10B981; border: 3px solid #fff;
            border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.3); text-align: center;
            line-height: 24px; color: white; font-weight: bold; font-size: 11px;
        }
        .target-marker {
            width: 36px; height: 36px; background-color: #EF4444; border: 3px solid #fff;
            border-radius: 50%; box-shadow: 0 0 12px rgba(239, 68, 68, 0.8); text-align: center;
            line-height: 30px; color: white; font-size: 16px; animation: bounce 1s infinite alternate;
        }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col font-sans overflow-hidden">

    <!-- 상단 로고 헤더 -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-sm z-30">
        <div class="flex items-center gap-3">
            <div class="bg-emerald-500 text-white p-2 rounded-xl flex items-center justify-center w-10 h-10 shadow-md">
                <i class="fa-solid fa-crosshairs text-xl"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">여기서 만나</h1>
                    <span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Live GPS</span>
                </div>
                <p class="text-xs text-slate-500">실시간 약속장소 & 위치 메이트</p>
            </div>
        </div>
        <div id="room-header-info" class="hidden flex items-center gap-2">
            <span id="room-title-tag" class="bg-slate-100 text-slate-700 font-bold text-xs px-3 py-1.5 rounded-lg border border-slate-200"></span>
            <span id="member-count" class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold px-3 py-1.5 rounded-lg"></span>
            <button onclick="copyShareLink()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3.5 py-1.5 rounded-lg font-bold transition flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-share-nodes"></i> 초대의 링크 복사
            </button>
        </div>
    </header>

    <!-- 1단계: 모임방 생성 폼 화면 (첨부해주신 이미지와 동일한 화면) -->
    <main id="create-room-view" class="flex-1 overflow-y-auto p-4 flex items-center justify-center bg-slate-100">
        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 max-w-lg w-full overflow-hidden my-auto">
            <!-- 상단 헤더 카드 -->
            <div class="bg-slate-900 text-white p-6 relative overflow-hidden">
                <span class="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-3 py-1 rounded-full border border-emerald-500/30">
                    📍 초간단 모임방 생성
                </span>
                <h2 class="text-2xl font-black mt-3 mb-1">여기서 만나</h2>
                <p class="text-xs text-slate-300">닉네임과 약속 장소를 정하면 실시간 공유 가능한 방이 생성됩니다.</p>
            </div>

            <!-- 입력 폼 -->
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">내 닉네임</label>
                    <input type="text" id="user-name" placeholder="예: 길동이" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 bg-slate-50/50">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">모임 이름</label>
                    <input type="text" id="room-name" placeholder="예: 번개 모임 ⚡" class="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 bg-slate-50/50">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1.5">약속 장소 검색</label>
                    <div class="flex gap-2">
                        <input type="text" id="target-search-input" placeholder="예: 동탄역, 강남역, 병점역, 성수동" class="flex-1 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 bg-slate-50/50">
                        <button onclick="searchPlace()" class="bg-slate-900 text-white font-bold px-5 py-3 rounded-xl text-sm hover:bg-slate-800 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-magnifying-glass"></i> 검색
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">정원</label>
                        <select id="max-members" class="w-full border border-slate-200 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500 bg-slate-50/50">
                            <option value="2">2명</option>
                            <option value="3" selected>3명</option>
                            <option value="4">4명</option>
                            <option value="5">5명</option>
                            <option value="10">10명</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5">약속 날짜 & 시간</label>
                        <input type="datetime-local" id="meet-time" class="w-full border border-slate-200 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-emerald-500 bg-slate-50/50">
                    </div>
                </div>

                <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl p-3">
                    <input type="checkbox" id="gps-agree" checked class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 border-slate-300">
                    <label for="gps-agree" class="text-xs font-bold text-slate-700 cursor-pointer">입장 시 내 실시간 위치 공유 동의</label>
                </div>

                <button onclick="createRoom()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg transition text-base flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rocket"></i> 모임방 바로 개설하기
                </button>
            </div>
        </div>
    </main>

    <!-- 2단계: 실시간 지도 & 위치 공유 화면 -->
    <div id="room-map-view" class="hidden flex-1 relative">
        <div id="map"></div>

        <!-- 하단 실시간 채팅 & 상태창 -->
        <div class="absolute bottom-3 left-3 right-3 z-10 bg-white/95 backdrop-blur-md border border-slate-200 rounded-2xl p-3 shadow-2xl max-w-lg mx-auto flex flex-col gap-2">
            <div id="chat-box" class="h-20 overflow-y-auto text-xs text-slate-700 flex flex-col gap-1 pr-1 font-medium">
                <div class="text-emerald-600 font-bold">👋 약속 장소가 지정된 실시간 방이 개설되었습니다. 초대 링크로 메이트들을 불러보세요!</div>
            </div>
            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="메시지 입력..." class="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-emerald-500" onkeypress="if(event.key==='Enter') sendChat()">
                <button onclick="sendChat()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold">전송</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://meet-here-default-rtdb.asia-southeast1.firebasedatabase.app" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let map, myMarker, targetMarker;
        let userMarkers = {};
        let myPos = { lat: 37.5665, lng: 126.9780 };
        let selectedTargetPos = null;
        let currentRoomId = null;
        let myNickName = "익명";

        // 오늘 날짜 기본 세팅
        document.getElementById('meet-time').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);

        // URL 파라미터 체크 (초대 링크로 진입한 경우 바로 지도 화면으로 전환)
        const urlParams = new URLSearchParams(window.location.search);
        const roomIdParam = urlParams.get('room');

        if (roomIdParam) {
            currentRoomId = roomIdParam;
            const enteredName = prompt("모임방 참여 닉네임을 입력해주세요:", "길동이") || "참여자";
            myNickName = enteredName;
            startRoomSession();
        }

        async function searchPlace() {
            const query = document.getElementById('target-search-input').value.trim();
            if (!query) return alert("검색할 약속 장소를 입력하세요.");
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data.length > 0) {
                    selectedTargetPos = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                    alert(`'${data[0].display_name.split(',')[0]}' 위치로 지정되었습니다.`);
                } else {
                    alert("장소를 찾을 수 없습니다.");
                }
            } catch(e) { alert("검색 중 오류가 발생했습니다."); }
        }

        function createRoom() {
            myNickName = document.getElementById('user-name').value.trim() || "모임장";
            const roomName = document.getElementById('room-name').value.trim() || "즐거운 모임";
            const maxMemb = document.getElementById('max-members').value;
            const meetTime = document.getElementById('meet-time').value;

            currentRoomId = Math.random().toString(36).substring(2, 8);
            window.history.replaceState({}, '', `?room=${currentRoomId}`);

            // Firebase 방 데이터 저장
            db.ref(`rooms/${currentRoomId}/info`).set({
                title: roomName,
                max: maxMemb,
                time: meetTime
            });

            if (selectedTargetPos) {
                db.ref(`rooms/${currentRoomId}/target`).set(selectedTargetPos);
            }

            startRoomSession();
        }

        function startRoomSession() {
            document.getElementById('create-room-view').classList.add('hidden');
            document.getElementById('room-map-view').classList.remove('hidden');
            document.getElementById('room-header-info').classList.remove('hidden');

            // 방 정보 받아오기
            db.ref(`rooms/${currentRoomId}/info`).once('value', snapshot => {
                const info = snapshot.val() || {};
                document.getElementById('room-title-tag').innerText = info.title || "모임방";
            });

            initMap();
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([myPos.lat, myPos.lng], 15);
            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            // 실시간 내 GPS 트래킹
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((pos) => {
                    myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    updateMyLocation();
                }, null, { enableHighAccuracy: true });
            }

            // 접속 모임원 실시간 동기화
            db.ref(`rooms/${currentRoomId}/users`).on('value', (snapshot) => {
                const users = snapshot.val() || {};
                const uKeys = Object.keys(users);
                document.getElementById('member-count').innerText = `접속: ${uKeys.length}명`;

                uKeys.forEach(uid => {
                    const uData = users[uid];
                    if (uData.lat && uData.lng) {
                        if (!userMarkers[uid]) {
                            const icon = L.divIcon({ className: 'user-marker', html: uData.name ? uData.name[0] : '유' });
                            userMarkers[uid] = L.marker([uData.lat, uData.lng], { icon }).addTo(map);
                        } else {
                            userMarkers[uid].setLatLng([uData.lat, uData.lng]);
                        }
                    }
                });
            });

            // 약속 장소 핀 동기화
            db.ref(`rooms/${currentRoomId}/target`).on('value', (snapshot) => {
                const target = snapshot.val();
                if (target) {
                    if (targetMarker) map.removeLayer(targetMarker);
                    const icon = L.divIcon({ className: 'target-marker', html: '<i class="fa-solid fa-flag"></i>' });
                    targetMarker = L.marker([target.lat, target.lng], { icon }).addTo(map);
                    map.setView([target.lat, target.lng], 15);
                }
            });

            // 채팅 수신
            db.ref(`rooms/${currentRoomId}/chats`).limitToLast(10).on('child_added', (snapshot) => {
                const chat = snapshot.val();
                const chatBox = document.getElementById('chat-box');
                const msg = document.createElement('div');
                msg.innerHTML = `<span class="font-bold text-slate-900">${chat.sender}:</span> ${chat.text}`;
                chatBox.appendChild(msg);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function updateMyLocation() {
            const myUid = 'user_' + myNickName;
            if (!myMarker) {
                const icon = L.divIcon({ className: 'user-marker', html: myNickName[0] });
                myMarker = L.marker([myPos.lat, myPos.lng], { icon }).addTo(map);
            } else {
                myMarker.setLatLng([myPos.lat, myPos.lng]);
            }
            db.ref(`rooms/${currentRoomId}/users/${myUid}`).set({
                name: myNickName,
                lat: myPos.lat,
                lng: myPos.lng
            });
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            db.ref(`rooms/${currentRoomId}/chats`).push({ sender: myNickName, text });
            input.value = '';
        }

        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("모임방 초대 링크가 복사되었습니다! 카카오톡에 전송해 보세요.");
        }
    </script>
</body>
</html>
