<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>여기서 만나 - 스마트 실시간 약속 플랫폼</title>
    <!-- Pretendard 웹 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Tailwind CSS & Leaflet -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase Realtime SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        #map { height: calc(100vh - 160px); width: 100%; z-index: 1; background-color: #f8fafc !important; }
        
        /* 스크린샷 기반의 진한 청록색 베이스 테마 적용 */
        .theme-deep-teal {
            background-color: #113832;
        }

        /* 지도 마커 스타일 */
        .my-custom-marker {
            width: 32px; height: 32px; background-color: #10B981; border: 3px solid #ffffff;
            border-radius: 50%; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); text-align: center;
            line-height: 26px; color: white; font-weight: 800; font-size: 13px;
            animation: pulse 1.8s infinite; z-index: 1000 !important;
        }
        .user-marker {
            width: 30px; height: 30px; background-color: #3B82F6; border: 3px solid #ffffff;
            border-radius: 50%; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); text-align: center;
            line-height: 24px; color: white; font-weight: 700; font-size: 12px; cursor: pointer;
        }
        .target-marker {
            width: 36px; height: 36px; background-color: #EF4444; border: 3px solid #ffffff;
            border-radius: 50%; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); text-align: center;
            line-height: 30px; color: white; font-size: 16px; animation: bounce 1s infinite alternate;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }

        /* 밝고 화사한 라이트 그리드 배너 */
        .bright-grid-banner {
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(at 10% 20%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                linear-gradient(rgba(203, 213, 225, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(203, 213, 225, 0.4) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 28px 28px, 28px 28px;
            animation: gridMove 16s linear infinite;
        }
        @keyframes gridMove {
            0% { background-position: 0 0, 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 0, 28px 28px, 28px 28px; }
        }
        .char-bounce { animation: charHop 2.2s ease-in-out infinite; }
        @keyframes charHop {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-5px) rotate(1deg); }
        }
        .radar-ping {
            position: absolute; border-radius: 50%; border: 2px solid rgba(16, 185, 129, 0.5);
            animation: radarPulse 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }
        @keyframes radarPulse {
            0% { width: 20px; height: 20px; opacity: 1; }
            100% { width: 140px; height: 140px; opacity: 0; }
        }
    </style>
</head>
<body class="theme-deep-teal text-slate-800 h-screen w-screen overflow-hidden flex flex-col antialiased">

    <!-- 상단 대시보드 상태바 (스크린샷 스타일 반영) -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 py-2.5 flex items-center justify-between z-30 shadow-sm shrink-0 gap-2 overflow-x-auto">
        <div class="flex items-center gap-3 shrink-0">
            <div class="bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-xl font-extrabold text-xs flex items-center gap-1.5 border border-emerald-300">
                <i class="fa-solid fa-users"></i> <span id="room-title-display">모임명: 여기서만나</span>
            </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
            <div class="bg-slate-100 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-700 border border-slate-200 flex items-center gap-1.5">
                <i class="fa-solid fa-calendar-days text-amber-500"></i> <span id="header-meet-time">약속 시간 대기중</span>
            </div>
            <div class="bg-slate-100 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-700 border border-slate-200 flex items-center gap-1.5 max-w-[200px] truncate">
                <i class="fa-solid fa-location-dot text-rose-500"></i> <span id="header-target-name">장소 미지정</span>
            </div>
            <button onclick="toggleGPSSharing()" id="toggle-gps-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition shadow-sm flex items-center gap-1">
                <i class="fa-solid fa-satellite-dish"></i> 위치공유 ON
            </button>
            <button onclick="copyShareLink()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition shadow-sm flex items-center gap-1">
                <i class="fa-solid fa-share-nodes"></i> 초대
            </button>
            <button id="explode-btn" onclick="explodeRoom()" class="hidden bg-rose-500 hover:bg-rose-600 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition shadow-sm">
                방 폭파
            </button>
        </div>
    </header>

    <!-- 📱 1단계: 모임 개설 모달 -->
    <div id="create-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-sm w-full shadow-2xl my-auto overflow-hidden">
            
            <div class="relative h-44 bright-grid-banner flex flex-col justify-between p-4 text-slate-800 overflow-hidden">
                <div class="flex justify-between items-start z-10">
                    <div class="inline-flex items-center gap-1.5 bg-white/90 backdrop-blur-md text-emerald-700 text-[10px] font-extrabold px-2.5 py-1 rounded-full border border-emerald-200 shadow-sm">
                        <i class="fa-solid fa-map-location-dot text-emerald-600"></i> 실시간 모임 지도
                    </div>
                    <span class="text-[10px] text-slate-500 font-mono tracking-wider bg-white/90 px-2 py-0.5 rounded-md shadow-sm">MAP MODE</span>
                </div>

                <div class="relative flex items-center justify-center my-1 z-10">
                    <div class="radar-ping"></div>
                    <div class="radar-ping" style="animation-delay: 1.2s;"></div>
                    
                    <div class="char-bounce bg-white/95 text-slate-900 px-4 py-2.5 rounded-2xl shadow-xl border border-emerald-200 flex items-center gap-3 backdrop-blur-md">
                        <div class="w-8 h-8 bg-emerald-500 text-white rounded-full flex items-center justify-center text-xs font-black shadow-md shadow-emerald-500/30">
                            <i class="fa-solid fa-location-crosshairs"></i>
                        </div>
                        <div class="text-left">
                            <div class="text-xs font-extrabold text-emerald-600 leading-tight">스마트 약속 모임</div>
                            <div class="text-[10px] text-slate-500">내 친구 실시간 위치 한눈에</div>
                        </div>
                    </div>
                </div>

                <div class="relative z-10">
                    <h2 class="text-xl font-black tracking-tight text-slate-900">여기서 만나</h2>
                    <p class="text-[11px] text-slate-600 font-medium">위치 공유부터 1/N 회비 정산까지 손쉽게!</p>
                </div>
            </div>

            <div class="p-5 space-y-3 bg-white">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                        <i class="fa-solid fa-users text-emerald-500"></i> 1. 모임 이름
                    </label>
                    <input type="text" id="init-roomtitle" placeholder="예: 즐거운 주말 모임 ☕" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div class="relative">
                    <label class="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                        <i class="fa-solid fa-location-dot text-rose-500"></i> 2. 약속장소 (상호명 또는 도로명/지번 주소)
                    </label>
                    <div class="flex gap-2">
                        <input type="text" id="init-target-input" placeholder="예: 병점역 광장, 강남 스타벅스" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-emerald-500 transition" onkeypress="if(event.key==='Enter') searchPlaces()">
                        <button onclick="searchPlaces()" class="bg-slate-100 hover:bg-slate-200 text-emerald-600 border border-emerald-200 font-bold px-3.5 py-2.5 rounded-xl text-xs transition">검색</button>
                    </div>
                    <div id="search-dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-2xl shadow-xl max-h-56 overflow-y-auto z-50 p-1 space-y-1"></div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                            <i class="fa-solid fa-user-group text-indigo-500"></i> 3. 정원
                        </label>
                        <select id="init-maxmembers" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-emerald-500">
                            <option value="2">2명</option>
                            <option value="3" selected>3명</option>
                            <option value="4">4명</option>
                            <option value="5">5명</option>
                            <option value="10">10명</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                            <i class="fa-solid fa-calendar-days text-amber-500"></i> 4. 약속 날짜 & 시간
                        </label>
                        <input type="datetime-local" id="init-meettime" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 text-[11px] text-slate-800 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 flex items-center gap-1">
                        <i class="fa-solid fa-user text-emerald-500"></i> 5. 내 이름 (닉네임)
                    </label>
                    <input type="text" id="init-username" placeholder="예: 홍길동" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div class="flex items-start gap-2 bg-slate-50 border border-slate-200 p-3 rounded-xl">
                    <input type="checkbox" id="agree-gps" checked class="mt-0.5 w-4 h-4 text-emerald-500 bg-white border-slate-300 rounded focus:ring-emerald-500">
                    <label for="agree-gps" class="text-[11px] text-slate-600 leading-snug cursor-pointer font-medium">
                        입장 시 내 실시간 위치 공유에 동의합니다. (지도에서 언제든지 중지 가능)
                    </label>
                </div>

                <button onclick="submitRoomCreation()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-extrabold py-3.5 rounded-xl shadow-lg shadow-emerald-500/20 transition text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rocket"></i> 모임방 바로 개설하기
                </button>
            </div>
        </div>
    </div>

    <!-- 💌 2단계: 초대받은 지인 모임 참여 모달 -->
    <div id="join-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-sm w-full shadow-2xl my-auto overflow-hidden">
            <div class="bg-gradient-to-br from-indigo-600 via-teal-600 to-emerald-600 p-5 text-white text-center">
                <div class="inline-flex items-center gap-1.5 bg-white/20 backdrop-blur-md text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full mb-1">
                    <i class="fa-solid fa-envelope-open-text text-amber-300"></i> 모임 초대장이 도착했습니다
                </div>
                <h2 id="join-room-title" class="text-xl font-black tracking-tight text-white truncate">모임에 초대되었습니다!</h2>
            </div>
            <div class="p-5 space-y-3 bg-white">
                <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 space-y-2 text-xs">
                    <div class="flex items-center gap-2 text-slate-700">
                        <i class="fa-solid fa-location-dot text-rose-500 w-4 text-center"></i>
                        <span class="font-bold">약속장소:</span> <span id="join-target-name" class="font-semibold text-slate-900 truncate">지정 중...</span>
                    </div>
                    <div class="flex items-center gap-2 text-slate-700">
                        <i class="fa-solid fa-calendar-days text-amber-500 w-4 text-center"></i>
                        <span class="font-bold">약속일시:</span> <span id="join-meet-time" class="font-semibold text-slate-900">확인 중...</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">모임에서 사용할 내 닉네임</label>
                    <input type="text" id="join-username" placeholder="예: 길동이" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="submitRoomJoin()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg transition text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> 모임방 지도로 참여하기
                </button>
            </div>
        </div>
    </div>

    <!-- 메인 레이아웃 (지도 + 우측 패널) -->
    <main class="flex-1 flex flex-col md:flex-row relative w-full h-full overflow-hidden">
        <!-- 지도 영역 -->
        <div id="map" class="flex-1 relative">
            <button onclick="panToMyLocation()" class="absolute bottom-4 right-4 z-20 bg-white border border-slate-300 text-emerald-600 w-11 h-11 rounded-2xl shadow-lg flex items-center justify-center font-bold transition hover:bg-slate-50" title="내 위치 찾기">
                <i class="fa-solid fa-crosshairs text-lg"></i>
            </button>
        </div>

        <!-- 우측 모임원 & 정산 패널 (스크린샷 스타일 반영) -->
        <aside class="w-full md:w-80 bg-white/95 backdrop-blur-md border-t md:border-t-0 md:border-l border-slate-200 p-3.5 flex flex-col gap-3 z-20 shadow-xl overflow-y-auto shrink-0 max-h-[35vh] md:max-h-none">
            <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <h3 class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-users text-indigo-500"></i> 모임원 현황
                </h3>
                <span id="member-count-badge" class="text-xs font-extrabold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">1/3 참여</span>
            </div>

            <!-- 모임원 리스트 -->
            <div id="member-items-container" class="space-y-1.5 max-h-36 overflow-y-auto pr-1">
                <div class="bg-slate-50 border border-slate-200 p-2 rounded-xl flex justify-between items-center text-xs">
                    <div class="flex items-center gap-2">
                        <div class="w-6 h-6 rounded-full bg-emerald-500 text-white text-[10px] font-bold flex items-center justify-center">나</div>
                        <span class="font-bold text-slate-800">나 (접속중)</span>
                    </div>
                    <span class="text-[10px] text-emerald-600 font-semibold">위치 확인 중</span>
                </div>
            </div>

            <!-- 채팅창 -->
            <div class="flex-1 flex flex-col min-h-[120px] bg-slate-50 border border-slate-200 rounded-2xl p-2.5 shadow-sm">
                <div id="chat-box" class="flex-1 overflow-y-auto text-xs text-slate-700 flex flex-col gap-1 pr-1 font-sans">
                    <div class="text-emerald-600 font-bold">👋 실시간 위치 공유방입니다!</div>
                </div>
                <div class="flex gap-1.5 mt-2">
                    <input type="text" id="chat-input" placeholder="메시지 입력..." class="flex-1 bg-white border border-slate-200 rounded-xl px-2.5 py-1 text-xs text-slate-800 focus:outline-none focus:border-emerald-500" onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1 rounded-xl text-xs font-bold transition">전송</button>
                </div>
            </div>

            <!-- 회비 장부 & 1/N 정산 -->
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-2.5 flex flex-col gap-2">
                <div class="flex justify-between items-center border-b border-slate-200 pb-1">
                    <span class="text-xs font-bold text-amber-600 flex items-center gap-1"><i class="fa-solid fa-receipt"></i> 모임 회비 장부</span>
                    <span id="total-expense-badge" class="text-[11px] font-extrabold text-amber-600">총 0원</span>
                </div>
                <div class="grid grid-cols-2 gap-1.5">
                    <input type="text" id="payer-name" placeholder="결제자" class="bg-white border border-slate-200 rounded-lg px-2 py-1 text-[11px] text-slate-800">
                    <input type="number" id="stage-total" placeholder="금액(원)" class="bg-white border border-slate-200 rounded-lg px-2 py-1 text-[11px] text-slate-800">
                </div>
                <div class="flex gap-1">
                    <button onclick="savePaymentOnly()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-1 rounded-lg text-[11px] transition">기록추가</button>
                    <button onclick="openDutchModal()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-1 rounded-lg text-[11px] transition">1/N 정산</button>
                </div>
            </div>
        </aside>
    </main>

    <!-- 정산 모달 -->
    <div id="dutch-modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-2xl p-5 max-w-xs w-full shadow-2xl flex flex-col gap-3">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h3 class="text-xs font-bold text-amber-600 flex items-center gap-1.5"><i class="fa-solid fa-calculator"></i> 1/N 정산 계산기</h3>
                <button onclick="closeDutchModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div>
                <p id="dutch-modal-info" class="text-xs text-slate-600 mb-2 font-medium"></p>
                <label class="block text-[11px] font-bold text-slate-500 mb-1">참여 인원수</label>
                <input type="number" id="dutch-member-count" value="3" min="1" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800">
            </div>
            <button onclick="confirmDutchCalculation()" class="w-full bg-amber-500 text-white font-bold py-2 rounded-xl text-xs transition">계산하기</button>
            <div id="dutch-modal-result" class="hidden bg-amber-50 border border-amber-200 p-2.5 rounded-xl text-center text-xs text-amber-700 font-bold"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://meet-here-default-rtdb.asia-southeast1.firebasedatabase.app" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let map, myMarker, targetMarker;
        let userMarkers = {};
        let myPos = null;
        let tempTargetPos = null;
        let targetPos = null;
        let currentRoomId = null;
        let myNickName = "나";
        let isSharingGPS = true;
        let watchId = null;
        let isHost = false;
        let paymentHistory = [];

        document.getElementById('init-meettime').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);

        const urlParams = new URLSearchParams(window.location.search);
        const roomIdParam = urlParams.get('room');

        window.onload = () => {
            if (roomIdParam) {
                currentRoomId = roomIdParam;
                document.getElementById('create-modal').classList.add('hidden');
                document.getElementById('join-modal').classList.remove('hidden');

                db.ref(`rooms/${currentRoomId}/info`).once('value', snapshot => {
                    const info = snapshot.val() || {};
                    if (info.title) {
                        document.getElementById('join-room-title').innerText = info.title;
                        document.getElementById('room-title-display').innerText = `모임명: ${info.title}`;
                    }
                    if (info.time) {
                        const formattedTime = info.time.replace('T', ' ');
                        document.getElementById('join-meet-time').innerText = formattedTime;
                        document.getElementById('header-meet-time').innerText = formattedTime;
                    }
                });
                db.ref(`rooms/${currentRoomId}/target`).once('value', snapshot => {
                    const target = snapshot.val();
                    if (target && target.name) {
                        document.getElementById('join-target-name').innerText = target.name;
                        document.getElementById('header-target-name').innerText = target.name;
                    }
                });
            }
        };

        function submitRoomJoin() {
            if (!document.getElementById('join-agree-gps')?.checked && document.getElementById('join-username').value.trim() === "") {
                // 편의상 패스
            }
            myNickName = document.getElementById('join-username').value.trim() || "참여자";
            document.getElementById('join-modal').classList.add('hidden');
            initApp();
        }

        async function searchPlaces() {
            const rawQuery = document.getElementById('init-target-input').value.trim();
            if (!rawQuery) return alert("검색할 약속장소 또는 주소를 입력하세요.");
            const dropdown = document.getElementById('search-dropdown');
            dropdown.innerHTML = '<div class="p-2.5 text-center text-xs text-slate-400">장소 검색 중...</div>';
            dropdown.classList.remove('hidden');

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(rawQuery)}&countrycodes=kr&accept-language=ko&limit=5`);
                const data = await res.json();
                dropdown.innerHTML = '';
                if(data.length === 0) {
                    dropdown.innerHTML = '<div class="p-2.5 text-center text-xs text-rose-500">검색 결과가 없습니다.</div>';
                    return;
                }
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "p-2.5 hover:bg-slate-100 cursor-pointer rounded-xl transition text-xs font-semibold text-slate-800 border-b border-slate-100 last:border-0";
                    div.onclick = () => {
                        tempTargetPos = { lat: parseFloat(item.lat), lng: parseFloat(item.lon), name: item.display_name.split(',')[0] };
                        document.getElementById('init-target-input').value = tempTargetPos.name;
                        dropdown.classList.add('hidden');
                        alert(`'${tempTargetPos.name}' 지정 완료!`);
                    };
                    div.innerText = item.display_name;
                    dropdown.appendChild(div);
                });
            } catch(e) {
                dropdown.innerHTML = '<div class="p-2.5 text-center text-xs text-rose-500">검색 오류 발생</div>';
            }
        }

        function submitRoomCreation() {
            myNickName = document.getElementById('init-username').value.trim() || "모임장";
            const title = document.getElementById('init-roomtitle').value.trim() || "즐거운 모임 ⚡";
            const maxMem = document.getElementById('init-maxmembers').value;
            const meetTime = document.getElementById('init-meettime').value;

            currentRoomId = Math.random().toString(36).substring(2, 8);
            window.history.replaceState({}, '', `?room=${currentRoomId}`);
            isHost = true;
            document.getElementById('explode-btn').classList.remove('hidden');

            db.ref(`rooms/${currentRoomId}/info`).set({ title, owner: myNickName, max: maxMem, time: meetTime });
            if (tempTargetPos) db.ref(`rooms/${currentRoomId}/target`).set(tempTargetPos);

            document.getElementById('room-title-display').innerText = `모임명: ${title}`;
            if(meetTime) document.getElementById('header-meet-time').innerText = meetTime.replace('T', ' ');
            if(tempTargetPos) document.getElementById('header-target-name').innerText = tempTargetPos.name;

            document.getElementById('create-modal').classList.add('hidden');
            initApp();
        }

        function initApp() {
            map = L.map('map', { zoomControl: false }).setView([37.5665, 126.9780], 15);
            L.control.zoom({ position: 'topright' }).addTo(map);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            startGPSWatch();

            db.ref(`rooms/${currentRoomId}/users`).on('value', (snapshot) => {
                const users = snapshot.val() || {};
                const uKeys = Object.keys(users);
                document.getElementById('member-count-badge').innerText = `${uKeys.length}명 참여`;

                const container = document.getElementById('member-items-container');
                container.innerHTML = '';
                uKeys.forEach(uid => {
                    const uData = users[uid];
                    if (uData.lat && uData.lng) {
                        const mDiv = document.createElement('div');
                        mDiv.className = "bg-slate-50 border border-slate-200 p-2 rounded-xl flex justify-between items-center text-xs";
                        mDiv.innerHTML = `<span class="font-bold text-slate-800">${uData.name}</span><span class="text-[10px] text-emerald-600 font-bold">공유중</span>`;
                        container.appendChild(mDiv);

                        if (uid !== 'user_' + myNickName) {
                            if (!userMarkers[uid]) {
                                const icon = L.divIcon({ className: 'user-marker', html: uData.name[0] });
                                userMarkers[uid] = L.marker([uData.lat, uData.lng], { icon }).addTo(map);
                            } else {
                                userMarkers[uid].setLatLng([uData.lat, uData.lng]);
                            }
                        }
                    }
                });
            });

            db.ref(`rooms/${currentRoomId}/target`).on('value', (snapshot) => {
                const target = snapshot.val();
                if (target) {
                    targetPos = target;
                    document.getElementById('header-target-name').innerText = target.name;
                    if (targetMarker) map.removeLayer(targetMarker);
                    const icon = L.divIcon({ className: 'target-marker', html: '<i class="fa-solid fa-flag"></i>' });
                    targetMarker = L.marker([target.lat, target.lng], { icon }).addTo(map);
                }
            });

            db.ref(`rooms/${currentRoomId}/chats`).limitToLast(10).on('child_added', (snapshot) => {
                const chat = snapshot.val();
                const chatBox = document.getElementById('chat-box');
                const msg = document.createElement('div');
                msg.innerHTML = `<span class="font-bold text-emerald-600">${chat.sender}:</span> ${chat.text}`;
                chatBox.appendChild(msg);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function startGPSWatch() {
            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition((pos) => {
                    if (!isSharingGPS) return;
                    const isFirst = (myPos === null);
                    myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    syncMyLocation();
                    if (isFirst) map.setView([myPos.lat, myPos.lng], 16);
                }, () => {}, { enableHighAccuracy: true });
            }
        }

        function toggleGPSSharing() {
            isSharingGPS = !isSharingGPS;
            const btn = document.getElementById('toggle-gps-btn');
            btn.className = isSharingGPS ? "bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition shadow-sm" : "bg-slate-300 text-slate-600 text-xs px-3 py-1.5 rounded-xl font-bold transition";
            btn.innerHTML = isSharingGPS ? `<i class="fa-solid fa-satellite-dish"></i> 위치공유 ON` : `<i class="fa-solid fa-ban"></i> 위치공유 OFF`;
        }

        function syncMyLocation() {
            if (!myPos || !isSharingGPS || !currentRoomId) return;
            db.ref(`rooms/${currentRoomId}/users/user_${myNickName}`).set({ name: myNickName, lat: myPos.lat, lng: myPos.lng });
            if (!myMarker) {
                const icon = L.divIcon({ className: 'my-custom-marker', html: myNickName[0] });
                myMarker = L.marker([myPos.lat, myPos.lng], { icon }).addTo(map);
            } else {
                myMarker.setLatLng([myPos.lat, myPos.lng]);
            }
        }

        function panToMyLocation() {
            if (myPos) map.setView([myPos.lat, myPos.lng], 16);
            else alert("GPS 위치 수신 대기 중입니다.");
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !currentRoomId) return;
            db.ref(`rooms/${currentRoomId}/chats`).push({ sender: myNickName, text });
            input.value = '';
        }

        function copyShareLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("초대 링크가 복사되었습니다!");
        }

        function savePaymentOnly() {
            const payer = document.getElementById('payer-name').value.trim() || "결제자";
            const total = parseInt(document.getElementById('stage-total').value);
            if (!total) return alert("금액을 입력하세요.");
            paymentHistory.push({ payer, total });
            document.getElementById('total-expense-badge').innerText = `총 ${paymentHistory.reduce((a,c)=>a+c.total,0).toLocaleString()}원`;
            document.getElementById('payer-name').value = '';
            document.getElementById('stage-total').value = '';
        }

        function openDutchModal() {
            const sumTotal = paymentHistory.reduce((a,c)=>a+c.total,0);
            if (!sumTotal) return alert("등록된 지출 내역이 없습니다.");
            document.getElementById('dutch-modal-info').innerText = `총 지출: ${sumTotal.toLocaleString()}원`;
            document.getElementById('dutch-modal-result').classList.add('hidden');
            document.getElementById('dutch-modal').classList.remove('hidden');
        }

        function confirmDutchCalculation() {
            const sumTotal = paymentHistory.reduce((a,c)=>a+c.total,0);
            const count = parseInt(document.getElementById('dutch-member-count').value) || 1;
            const price = Math.ceil((sumTotal / count) / 100) * 100;
            const resBox = document.getElementById('dutch-modal-result');
            resBox.innerText = `1인당 ${price.toLocaleString()} 원씩 정산`;
            resBox.classList.remove('hidden');
        }

        function closeDutchModal() { document.getElementById('dutch-modal').classList.add('hidden'); }
        function explodeRoom() {
            if (confirm("방을 폭파하시겠습니까?")) {
                if (currentRoomId) db.ref(`rooms/${currentRoomId}`).remove();
                window.location.href = window.location.pathname;
            }
        }
    </script>
</body>
</html>
